plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'tv.boughazi.app'
    compileSdk 34

    defaultConfig {
        applicationId "tv.boughazi.app"
        minSdk 21
        targetSdk 34
        // En GitHub Actions el número de versión sube solo en cada
        // compilación (VERSION_CODE lo pone el workflow). Android solo
        // instala una actualización si este número es MAYOR que el de la
        // versión que ya está en la tele.
        versionCode((System.getenv("VERSION_CODE") ?: "1").toInteger())
        versionName System.getenv("VERSION_NAME") ?: "1.0.0"
    }

    // Firma fija para que cada APK nuevo se instale ENCIMA del anterior.
    // Sin ella, cada compilación de GitHub Actions usa una firma distinta
    // y aleatoria, y Android se niega en silencio a actualizar la app.
    // La clave NO se guarda en el repositorio (es público): el workflow
    // la crea a partir de los secretos de GitHub antes de compilar.
    def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
    def hasFixedKey = keystorePath != null && file(keystorePath).exists()

    if (hasFixedKey) {
        signingConfigs {
            fixed {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (hasFixedKey) {
                signingConfig signingConfigs.fixed
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
