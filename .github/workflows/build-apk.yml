name: Compilar APK de Boughazi.tv

on:
  push:
    branches: [ main ]
  # En los Pull Requests solo se comprueba que la app compila: no se
  # publica nada ni hace falta la firma.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      # El número de versión sube solo con cada compilación. Se suma 100
      # para quedar siempre por encima de las versiones antiguas (1 a 4).
      - name: Calcular el número de versión
        run: |
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Indicar a Gradle dónde está el SDK de Android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # La firma fija vive SOLO en los secretos del repositorio (Settings →
      # Secrets and variables → Actions), nunca en un archivo del código.
      # Sin ella, Android rechaza en silencio instalar la versión nueva
      # encima de la anterior. Por eso, en "main" la compilación se para
      # con un aviso claro si falta, en vez de publicar un APK que no se
      # podría actualizar.
      - name: Preparar la firma fija del APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Pull Request: se compila sin firma fija (no se publica nada)."
              exit 0
            fi
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64. Sin la firma fija las teles no podrán actualizar la app."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/boughazi.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/boughazi.keystore" >> "$GITHUB_ENV"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar el APK (debug, listo para instalar directamente)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleDebug --stacktrace

      - name: Subir el APK como resultado descargable (copia de seguridad)
        uses: actions/upload-artifact@v4
        with:
          name: boughazi-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK en un enlace permanente (para instalar con Downloader)
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: ultima-version
          name: "Boughazi-TV — última versión"
          body: "Instala esta app en tu televisor con la app Downloader, usando este mismo enlace."
          allowUpdates: true
          replacesArtifacts: true
          artifacts: app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
